[project]
name = "competitor-research-agent"
version = "0.1.0"
description = "Multi-agent competitor analysis with LangGraph, Tavily, and Nebius"
authors = [
    { name = "surya-helios", email = "prasanna_gudipati@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
